[Service]
# The old host-specific bind address is not available after reboot. Override it
# on the command line so the local-only Redis service always has a valid IP.
ExecStart=
ExecStart=/usr/bin/redis-server /etc/redis/redis.conf --supervised systemd --daemonize no --bind 127.0.0.1

# Avoid a rapid failure loop reaching systemd's start-rate limit before Redis
# has had a chance to recover from a transient filesystem or network problem.
Restart=on-failure
RestartSec=5s
