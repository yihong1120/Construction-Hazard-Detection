# Add these locations to the HTTPS changdar-server.mooo.com server block.
#
# Replace this root with the real Flutter Web build directory.
# Your current server uses:
# /home/changdar/Documents/Construction-Hazard-Detection/frontend/web

location = /.well-known/apple-app-site-association {
    root /home/changdar/Documents/Construction-Hazard-Detection/frontend/web;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /.well-known/assetlinks.json {
    root /home/changdar/Documents/Construction-Hazard-Detection/frontend/web;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Flutter SPA fallback also handles /reset_password?token=... when the mobile
# app is not installed. Keep API/media locations above this block.
location / {
    root /home/changdar/Documents/Construction-Hazard-Detection/frontend/web;
    try_files $uri $uri/ /index.html;
}
