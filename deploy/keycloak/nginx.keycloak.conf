# Keycloak is reachable only through the existing HTTPS virtual host. Keep the
# upstream loopback-only; do not publish the management port (9000).
location = /keycloak {
    return 308 /keycloak/;
}

# Main-app entry point for the browser authorization-code flow.  This keeps
# Visionnaire as the public starting point while Keycloak owns credentials.
location = /login {
    return 302 /bff/auth/oidc/login?return_to=/;
}

location ^~ /keycloak/ {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;

    proxy_hide_header X-Powered-By;
    proxy_buffering off;
    proxy_request_buffering off;
}
