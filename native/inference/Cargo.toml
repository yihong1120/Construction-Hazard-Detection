[package]
name = "construction-inference"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "construction_inference"
crate-type = ["cdylib", "rlib"]

[features]
default = ["python"]
python = ["dep:pyo3"]
extension-module = ["python", "pyo3/extension-module"]
tensorrt = []
gpu-media = ["tensorrt"]

[dependencies]
rayon = "1.12"
pyo3 = { version = "=0.30.1", features = ["abi3-py311"], optional = true }
serde_json = "1"

[build-dependencies]
cc = "1"

[profile.release]
codegen-units = 1
lto = "thin"
