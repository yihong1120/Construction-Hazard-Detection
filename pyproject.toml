[project]
name = "construction-hazard-detection"
version = "0.0.0"
description = "AI-powered construction hazard detection with YOLO and real-time notifications"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
  { name = "Construction Hazard Detection Contributors" }
]
license = { file = "LICENSE" }
dependencies = [
  "aiofiles==25.1.0",
  "aiohttp==3.14.3",
  "aiortc==1.14.0",
  "aiosqlite==0.22.1",
  "albumentationsx==2.0.15",
  "apscheduler==3.11.2",
  "asyncpg==0.31.0",
  "ckip_transformers==0.3.4",
  "transformers==5.5.0",
  "cloudinary==1.44.1",
  "cryptography==50.0.0",
  "fastapi==0.139.2",
  "firebase_admin==7.1.0",
  "filelock==3.20.3",
  "GitPython==3.1.58",
  "httpx==0.28.1",
  "huggingface_hub==1.5.0",
  "idna==3.15",
  "jsonschema==4.26.0",
  "lxml==6.1.0",
  "mcp==1.28.1",
  "msgpack==1.2.1",
  "numpy==2.4.1",
  "onnx==1.22.0",
  "onnxruntime-gpu==1.27.0",
  "opencv_python==4.11.0.86",
  "opencv_python_headless==4.11.0.86",
  "Pillow==12.3.0",
  "pyarrow==23.0.1",
  "pyasn1==0.6.4",
  "pycocotools==2.0.11",
  "protobuf==6.33.5",
  "PyJWT==2.13.0",
  "pydantic[email]==2.12.5",
  "pydantic_settings==2.14.2",
  "pwdlib[argon2]==0.3.0",
  "python-dotenv==1.2.2",
  "python-engineio==4.13.2",
  "python-multipart==0.0.31",
  "python-socketio==5.16.2",
  "python-telegram-bot==22.6",
  "redis==7.1.0",
  "requests==2.33.0",
  "sahi==0.11.36",
  "schedule==1.2.2",
  "scipy==1.16.3",
  "scikit-learn==1.8.0",
  "setuptools==83.0.0",
  "shapely==2.1.2",
  "speedtest-cli==2.1.3",
  "sqlalchemy[asyncio]==2.0.46",
  "starlette==1.3.1",
  "streamlink==8.4.0",
  "streamlit==1.54.0",
  "structlog==25.5.0",
  "tenacity==9.1.2",
  "tensorrt==11.1.0.106",
  "tornado==6.5.7",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "twilio==9.10.0",
  "ultralytics==8.4.115",
  "urllib3==2.7.0",
  "uvicorn==0.40.0",
  "waitress==3.0.2",
  "watchdog==6.0.0",
]

[project.optional-dependencies]
dev = [
  "codecov==2.1.13",
  "pre-commit==4.5.1",
  "Pygments==2.20.0",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "pytest-xdist==3.8.0",
  "types-aiofiles",
  "types-requests",
  "virtualenv==20.36.1",
]

[tool.uv]
# This project is deployed on Linux hosts with CUDA/TensorRT dependencies.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.mypy]
show_error_codes = true

[tool.coverage.run]
omit = [
  "*/examples/auth/cache copy.py",
  "*/examples/YOLO_train/test.py",
  "*/examples/line_chatbot/line_bot.py",
]

[tool.coverage.report]
fail_under = 99.5
omit = [
  "*/examples/auth/cache copy.py",
  "*/examples/YOLO_train/test.py",
  "*/examples/line_chatbot/line_bot.py",
]

[[tool.mypy.overrides]]
module = ["ruamel.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["networkx.*", "shapely.*", "sklearn.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"
