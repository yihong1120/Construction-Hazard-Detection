[project]
name = "construction-hazard-detection"
version = "0.0.0"
description = "AI-powered construction hazard detection with YOLO and real-time notifications"
readme = "README.md"
requires-python = ">=3.14,<3.15"
authors = [
  { name = "Construction Hazard Detection Contributors" }
]
license = { file = "LICENSE" }
dependencies = [
  "aiofiles==25.1.0",
  "aiohttp==3.14.3",
  "anyio==4.15.1",
  "asyncpg==0.31.0",
  "cryptography==50.0.0",
  "fastapi==0.139.2",
  "httpx[http2]==0.28.1",
  "huggingface-hub==1.33.0",
  "PyJWT==2.15.1",
  "pydantic[email]==2.12.5",
  "pydantic_settings==2.14.2",
  "python-dotenv==1.2.2",
  "python-multipart==0.0.31",
  "redis==7.1.0",
  "sqlalchemy[asyncio]==2.0.46",
  "urllib3==2.8.0",
  "uvicorn==0.40.0",
]

[project.optional-dependencies]
mcp = [
  "mcp==1.28.1",
  "requests==2.33.0",
]
notification = [
  "firebase_admin==7.1.0",
]
social-notifications = [
  "cloudinary==1.44.1",
  "opencv_python==4.11.0.86",
  "python-telegram-bot==22.6",
  "numpy==2.4.1",
  "Pillow==12.3.0",
]
streaming = [
  "aiortc==1.14.0",
  "numpy==2.4.1",
  "opencv_python==4.11.0.86",
  "Pillow==12.3.0",
  "speedtest-cli==2.1.3",
  "streamlink==8.6.1",
]
violation = [
  "Pillow==12.3.0",
]
yolo = [
  "numpy==2.4.1",
  "opencv_python==4.11.0.86",
  "Pillow==12.3.0",
  "requests==2.33.0",
  "sahi==0.11.36",
  "scikit-learn==1.8.0",
  "scipy==1.16.3",
  "shapely==2.1.2",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "ultralytics==8.4.115",
  "watchdog==6.0.0",
]
yolo-gpu = [
  "onnx==1.22.0",
  "onnxruntime-gpu==1.27.0",
  "tensorrt==11.1.0.106",
]
training = [
  "opencv_python==4.11.0.86",
  "Pillow==12.3.0",
  "sahi==0.11.36",
  "scikit-learn==1.8.0",
  "scipy==1.16.3",
  "albumentationsx==2.0.15",
  "numpy==2.4.1",
  "onnx==1.22.0",
  "onnxruntime==1.27.0",
  "pycocotools==2.0.11",
  "PyYAML==6.0.3",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "tqdm==4.67.3",
  "transformers==5.18.0",
  "ultralytics==8.4.115",
]
dev = [
  "aiosqlite==0.22.1",
  "flake8==7.3.0",
  "pre-commit==4.6.2",
  "Pygments==2.20.0",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "pytest-xdist==3.8.0",
  "types-aiofiles",
  "types-requests",
  "virtualenv==21.14.5",
]

[tool.uv]
# This project is deployed on Linux hosts with CUDA/TensorRT dependencies.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.mypy]
show_error_codes = true

[tool.coverage.run]
omit = ["*/examples/YOLO_train/test.py"]

[tool.coverage.report]
# Keep application coverage at 96% or higher.
fail_under = 96

[[tool.mypy.overrides]]
module = ["networkx.*", "shapely.*", "sklearn.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"
