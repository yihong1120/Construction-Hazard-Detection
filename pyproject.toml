[project]
name = "construction-hazard-detection"
version = "0.0.0"
description = "AI-powered construction hazard detection with YOLO and real-time notifications"
readme = "README.md"
requires-python = ">=3.15,<3.16"
authors = [
  { name = "Construction Hazard Detection Contributors" }
]
license = { file = "LICENSE" }
dependencies = [
  "aiofiles==25.1.0",
  "aiohttp==3.14.5",
  "anyio==4.15.1",
  "asyncpg==0.32.0",
  "cryptography==50.0.2",
  "fastapi==0.156.0",
  "httpx[http2]==0.28.1",
  "huggingface-hub==2.2.0",
  "PyJWT==2.15.1",
  "pydantic[email]==2.14.1",
  "pydantic_settings==2.16.1",
  "python-dotenv==1.2.4",
  "python-multipart==0.0.32",
  "redis==8.1.0",
  "sqlalchemy[asyncio]==2.1.5",
  "urllib3==2.8.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
mcp = [
  "mcp==2.3.0",
  "requests==2.34.2",
]
notification = [
  "firebase_admin==7.7.0",
]
social-notifications = [
  "cloudinary==1.46.3",
  "opencv_python==5.0.0.93",
  "python-telegram-bot==22.8",
  "numpy==2.5.4",
  "Pillow==13.0.0",
]
streaming = [
  "aiortc==1.15.0",
  "numpy==2.5.4",
  "opencv_python==5.0.0.93",
  "Pillow==13.0.0",
  "speedtest-cli==2.1.3",
  "streamlink==8.6.2",
]
violation = [
  "Pillow==13.0.0",
]
yolo = [
  "numpy==2.5.4",
  "opencv_python==5.0.0.93",
  "Pillow==13.0.0",
  "requests==2.34.2",
  "sahi==0.12.8",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "shapely==2.2.0",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "ultralytics==8.4.183",
  "watchdog==6.0.0",
]
# ONNX Runtime and TensorRT require local CPython 3.15 builds; their pinned
# native dependencies are installed by deploy/python315/bootstrap.py.
yolo-gpu = [
  "onnx==1.23.2",
]
training = [
  "flatbuffers==25.12.19",
  "opencv_python==5.0.0.93",
  "Pillow==13.0.0",
  "sahi==0.12.8",
  "scikit-learn==1.9.1",
  "scipy==1.18.1",
  "albumentationsx==2.5.1",
  "numpy==2.5.4",
  "onnx==1.23.2",
  "onnxslim==0.1.98",
  "pycocotools==2.0.11",
  "PyYAML==6.0.3",
  "torch==2.14.1",
  "torchvision==0.29.1",
  "tqdm==4.70.1",
  "transformers==5.20.2",
  "ultralytics==8.4.183",
]
dev = [
  "aiosqlite==0.22.1",
  "defusedxml==0.7.1",
  "flake8==7.4.1",
  "pre-commit==4.7.0",
  "Pygments==2.21.0",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "types-aiofiles",
  "types-requests",
  "virtualenv==21.14.13",
]

[tool.uv]
# Minimum patched versions for transitive dependencies reported by Dependabot.
constraint-dependencies = [
  "dnspython>=2.9.0",
  "filelock>=4.2.1",
  "fsspec>=2026.6.0",
  "msgpack>=1.2.3",
  "multidict>=6.9.1",
  "pyasn1>=0.6.5",
  "setuptools>=84.1.0",
]
# This project is deployed on Linux hosts with CUDA/TensorRT dependencies.
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
[tool.uv.sources]
torch = [
  { url = "https://download-r2.pytorch.org/whl/cu130/torch-2.14.1%2Bcu130-cp315-cp315-manylinux_2_28_x86_64.whl", marker = "python_version >= '3.15'" },
]
torchvision = [
  { url = "https://download-r2.pytorch.org/whl/cu130/torchvision-0.29.1%2Bcu130-cp315-cp315-manylinux_2_28_x86_64.whl", marker = "python_version >= '3.15'" },
]

[tool.mypy]
python_version = "3.15"
show_error_codes = true

[tool.coverage.run]
omit = ["*/examples/YOLO_train/test.py"]

[tool.coverage.report]
# Keep application coverage at 96% or higher.
fail_under = 96

[[tool.mypy.overrides]]
module = ["networkx.*", "shapely.*", "sklearn.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = ["ml: requires the ML inference runtime (included in the native test job)"]
