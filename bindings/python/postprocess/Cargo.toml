[package]
name = "construction-postprocess"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
publish = false

[lib]
name = "construction_postprocess"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
construction-postprocess-core = { path = "../../../native/postprocess-core" }
pyo3 = { version = "=0.30.1", features = ["abi3-py311"] }
libc = "=0.2.191"

[profile.release]
codegen-units = 1
lto = "thin"
