# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/construction_hazard_detection_test

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip "uv==0.9.9"
        # Exercise every source module, but exclude the CUDA/TensorRT-only
        # deployment extra.  Tests use CPU-compatible ONNX Runtime.
        uv sync --frozen --all-extras --no-extra yolo-gpu
    - name: Verify lockfile
      run: uv lock --check
    - name: Lint with flake8
      run: |
        # Check repository source only: ``uv sync`` creates .venv before this
        # step, and dependency sources must not be linted as project code.
        uv run flake8 main.py src examples tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 main.py src examples tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        # Measure application code only (main, src, examples). Do not include tests in coverage sources
        uv run pytest \
          --cov=main \
          --cov=src \
          --cov=examples \
          --cov-report=term-missing \
          -n auto \
          tests/
