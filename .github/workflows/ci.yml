name: Workflow for Codecov example-python

permissions:
  contents: read

on: [push, pull_request]

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/construction_hazard_detection_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h
      - name: Update and upgrade apt-get
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get autoremove -y
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download model weights (Hugging Face)
        run: |
          hf download \
            yihong1120/Construction-Hazard-Detection-YOLO11 \
            --repo-type model \
            --include "models/pt/*.pt" \
            --local-dir .
      - name: Run tests and collect coverage
        run: |
          # Measure only application code (main, src, examples); exclude tests from coverage sources
          pytest \
            --cov=main \
            --cov=src \
            --cov=examples \
            --cov-report=term-missing \
            --cov-report=xml \
            -n auto \
            tests/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
