# Add these locations before the generic /hazard/ SPA location in the
# changdar-server.mooo.com server block.
#
# HLS is authorised only by the short-lived ``mt`` media capability issued by
# the db_management playback facade. Never translate a main access token into
# a media cookie or query token.

location = /hazard/api/media-auth {
    internal;
    proxy_pass http://127.0.0.1:8800/media-auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /hazard/media/webrtc/ {
    auth_request /hazard/api/media-auth;
    auth_request_set $media_auth_error $upstream_http_x_media_auth_error;
    proxy_pass http://127.0.0.1:8889/;
    proxy_redirect ~^/(.*)$ /hazard/media/webrtc/$1;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Access-Control-Allow-Origin "https://changdar-server.mooo.com" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET,POST,HEAD,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Range,Content-Type,Accept,Origin" always;
    add_header X-Media-Auth-Error $media_auth_error always;
    add_header Cache-Control "no-store" always;
    if ($request_method = OPTIONS) {
        return 204;
    }
}

location ^~ /hazard/media/ {
    auth_request /hazard/api/media-auth;
    auth_request_set $media_auth_error $upstream_http_x_media_auth_error;
    proxy_pass http://127.0.0.1:8890/;
    # Preserve the opaque `mt` capability across MediaMTX's cookieCheck
    # redirect. The redirected request is authenticated again by Nginx.
    proxy_redirect ~^/(.+)\?cookieCheck=1$ /hazard/media/$1?cookieCheck=1&mt=$arg_mt;
    proxy_redirect ~^/(.*)$ /hazard/media/$1;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Access-Control-Allow-Origin "https://changdar-server.mooo.com" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET,HEAD,OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization,Range,Content-Type,Accept,Origin" always;
    add_header X-Media-Auth-Error $media_auth_error always;
    add_header Cache-Control "no-store" always;
    if ($request_method = OPTIONS) {
        return 204;
    }
}
