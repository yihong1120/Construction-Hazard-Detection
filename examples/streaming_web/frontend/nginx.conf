server {
    # Listen on port 80 for incoming HTTP connections
    listen 80;
    # Specify the server name (domain or IP address)
    server_name changdar-server.mooo.com;

    # Set the root directory for serving static files
    root /usr/share/nginx/html;
    # Specify the default index file
    index index.html;

    # Define how Nginx should handle requests to the root URL
    location / {
        # Try to serve the requested file; if it doesn't exist, alternate to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy requests starting with /api/ to the backend service
    location ^~ /api/ {
        # Forward the request to the backend server at the specified address
        proxy_pass http://streaming-web-backend:8000/;
        # Preserve the original Host header
        proxy_set_header Host $host;
        # Pass the real client IP address to the backend
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve the X-Forwarded-For header for proxy chaining
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Enable support for WebSocket connections
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /api/media-auth {
        internal;
        proxy_pass http://streaming-web-backend:8000/media-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy WebRTC signalling requests to the backend service.
    location /webrtc/ {
        proxy_pass http://streaming-web-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy MediaMTX WebRTC/WHEP playback.
    location ^~ /media/webrtc/ {
        auth_request /api/media-auth;
        auth_request_set $media_auth_error $upstream_http_x_media_auth_error;
        proxy_pass http://media-server:8889/;
        proxy_redirect ~^/(.*)$ /media/webrtc/$1;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,POST,HEAD,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Range,Content-Type,Accept,Origin" always;
        add_header X-Media-Auth-Error $media_auth_error always;
        add_header Cache-Control "no-store" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Proxy MediaMTX HLS playback for browser and Flutter clients.
    location ^~ /media/ {
        auth_request /api/media-auth;
        auth_request_set $media_auth_error $upstream_http_x_media_auth_error;
        proxy_pass http://media-server:8888/;
        proxy_redirect ~^/(.*)$ /media/$1;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,HEAD,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Range,Content-Type,Accept,Origin" always;
        add_header X-Media-Auth-Error $media_auth_error always;
        add_header Cache-Control "no-store" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Support deployments where the Flutter/web app is mounted under /hazard.
    location ^~ /hazard/api/ {
        proxy_pass http://streaming-web-backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /hazard/api/media-auth {
        internal;
        proxy_pass http://streaming-web-backend:8000/media-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /hazard/webrtc/ {
        proxy_pass http://streaming-web-backend:8000/webrtc/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /hazard/media/webrtc/ {
        auth_request /hazard/api/media-auth;
        auth_request_set $media_auth_error $upstream_http_x_media_auth_error;
        proxy_pass http://media-server:8889/;
        proxy_redirect ~^/(.*)$ /hazard/media/webrtc/$1;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,POST,HEAD,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Range,Content-Type,Accept,Origin" always;
        add_header X-Media-Auth-Error $media_auth_error always;
        add_header Cache-Control "no-store" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location ^~ /hazard/media/ {
        auth_request /hazard/api/media-auth;
        auth_request_set $media_auth_error $upstream_http_x_media_auth_error;
        proxy_pass http://media-server:8888/;
        proxy_redirect ~^/(.*)$ /hazard/media/$1;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,HEAD,OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization,Range,Content-Type,Accept,Origin" always;
        add_header X-Media-Auth-Error $media_auth_error always;
        add_header Cache-Control "no-store" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Configure caching for static assets like images, CSS, JS, fonts, etc.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4)$ {
        # Set the cache expiration time to 6 months
        expires 6M;
        # Disable access logs for these requests
        access_log off;
        # Add a Cache-Control header to specify public caching
        add_header Cache-Control "public";
    }

    # Redirect 404 errors to index.html (useful for SPA routing)
    error_page 404 /index.html;

    # Handle WebSocket connections on the /ws/ endpoint
    location /ws/ {
        # Forward the WebSocket request to the backend server
        proxy_pass http://streaming-web-backend:8000;
        # Use HTTP/1.1 to support WebSocket connections
        proxy_http_version 1.1;
        # Set the necessary headers to upgrade the connection to WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Preserve the original Host header
        proxy_set_header Host $host;
        # Pass the real client IP address to the backend
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve the X-Forwarded-For header for proxy chaining
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
