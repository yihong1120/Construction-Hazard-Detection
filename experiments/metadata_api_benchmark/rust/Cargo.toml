[package]
name = "metadata-api-benchmark"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
redis = { version = "=0.32.7", default-features = false, features = ["streams", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
